<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
        <meta charset="UTF-8"> 
        <meta name="author" content="Karla Juliana Rodrigues">
        <title>Lista de Times</title> <!-- Adicionando título -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css"> <!-- Incluindo Bootstrap -->
  </head>
  <body>
    <div class="container">
        <h5>Edição de Partidas</h5>
        <p th:if="${mensagem}" th:text="${mensagem}"></p>
        <form action="/salvarPartida" method="post" th:object="${partida}">
            <input type="hidden" th:field="*{id}">

            <label for="estadio">Estádio</label>
            <input type="text" id="estadio" th:field="*{estadio}" placeholder="Informe o estádio">
            <br>
            <label for="timeCasa">Time da Casa</label>
            <input type="text" id="timeCasa" th:field="*{timeCasa}" placeholder="Informe o time da casa">
            <br>
            <label for="timeVisitante">Time Visitante</label>
            <input type="text" id="timeVisitante" th:field="*{timeVisitante}" placeholder="Informe o time Visitante">
            <br>
            <label for="daaHora">Data / Hora</label>
            <input type="datetime-local" id="dataHora" th:field="*{dataHora}" placeholder="Informe a data/hora">
            <br>
            <label for="resultado">Resultado</label>
            <input type="text" id="resultado" th:field="*{resultado}" placeholder="Informe o resultado">
            <br>
            <button type="submit">Salvar</button>
        </form>
    </div>
  </body>
</html>
