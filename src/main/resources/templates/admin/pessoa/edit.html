<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
        <meta charset="UTF-8"> 
        <meta name="author" content="Igor Mamus dos Santos">
        <title>Pessoa</title> <!-- Adicionando título -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css"> <!-- Incluindo Bootstrap -->
  </head>
  <body>
    <div class="container">
        <h5>Cadastro de Pessoa</h5>
        <p th:if="${mensagem}" th:text="${mensagem}"></p>
        <form action="/salvarPessoa" method="post" th:object="${pessoa}">
            <input type="hidden" th:field="*{cod_pessoa}">

            <label for="nome">Nome</label>
            <input type="text" id="nome" th:field="*{nome}" placeholder="Informe o nomeo">
            <br>
            <label for="email">Email</label>
            <input type="text" id="email" th:field="*{email}" placeholder="Informe o email">
            <br>
            <label for="cpf">Cpf</label>
            <input type="text" id="cpf" th:field="*{cpf}" placeholder="Informe o cpf">
            <br>
            <label for="dataNascimento">Data Nascimento</label>
            <input type="datetime-local" id="dataHora" th:field="*{data_nascimento}" placeholder="Informe a data do seu aniversario">
            <br>
            <label for="pronome">Pronome</label>
            <input type="text" id="pronome" th:field="*{pronome}" placeholder="Informe o pronome">
            <br>
            <button type="submit">Salvar</button>
        </form>
    </div>
  </body>
</html>
