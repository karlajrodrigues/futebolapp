<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
  <head>
        <meta charset="UTF-8"> 
        <meta name="author" content="Karla Juliana Rodrigues">
        <title>Lista de Times</title> <!-- Adicionando título -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.1.3/css/bootstrap.min.css"> <!-- Incluindo Bootstrap -->
  </head>
  <body>
    <div> 
        <th:replace="~{./menu.html}"/> 
    </div>
    <div class="container">
        <h5>Lista de Arenas</h5>

       
        <a href="/inserirTime" class="btn btn-primary mb-3">Nova Arena</a>

        
        <!-- Tabela de Times -->
        <table class="table table-striped mt-4">
            <thead>
                <tr>
                    <th>Id</th>
                    <th>Nome</th>
                    <th>Estado</th>
                    <th>Editar</th>
                    <th>Excluir</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="arena : ${arenas}">
                    <td th:text="${arena.id}"></td>
                    <td th:text="${arena.nome}"></td>
                    <td th:text="${arena.estado}"></td>
                    <td><a th:href="@{/admin/arena/editar/{id}(id=${arena.id})}">Editar</a></td>
                    <td><a th:href="@{/admin/arena/excluir/{id}(id=${arena.id})}" class="text-danger">Excluir</a></td>
                </tr>
            </tbody>
         </table>
    </div>
  </body>
</html>
